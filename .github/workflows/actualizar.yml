name: Actualizar datos

on:
  schedule:
    # No hay hora garantizada de publicación: se revisa seguido en la franja probable.
    # Lima (UTC-5), lunes a sábado: cada 30 min de 08:00 a 14:00 y cada hora de 15:00 a 21:00.
    # Cada corrida sin boletín nuevo dura ~1 minuto y no hace commit.
    - cron: "7,37 13-19 * * 1-6"
    - cron: "7 20-23,0-2 * * 1-6"
  workflow_dispatch:
    inputs:
      desde:
        description: "Procesar desde (AAAA-MM-DD). Vacío = solo los últimos 2 meses"
        required: false
        default: ""
      hasta:
        description: "Procesar hasta (AAAA-MM-DD). Opcional"
        required: false
        default: ""
      prueba_telegram:
        description: "Reenviar la última imagen a Telegram (prueba)"
        type: boolean
        default: false
      reintentar_cuarentena:
        description: "Reintentar PDFs en cuarentena"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawler
        run: |
          ARGS=""
          if [ -n "${{ inputs.desde }}" ]; then ARGS="--desde ${{ inputs.desde }}"; else ARGS="--ultimos-meses 2"; fi
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          if [ "${{ inputs.reintentar_cuarentena }}" = "true" ]; then ARGS="$ARGS --reintentar-cuarentena"; fi
          python scripts/crawler.py $ARGS 2>&1 | grep -v FontBBox | tee data/ultima_corrida.log
      - name: Imagen diaria (una por cada boletín nuevo)
        run: python scripts/imagenes_pendientes.py
      - name: Enviar a Telegram (si están configurados los secretos)
        if: env.TG_TOKEN != ''
        run: |
          CHAT=$(echo "$TG_CHAT" | tr -d '[:space:]'); T=$(echo "$TG_TOKEN" | tr -d '[:space:]')
          LISTA=$(cat imagenes/pendientes.txt 2>/dev/null || true)
          if [ -z "$LISTA" ] && [ "${{ inputs.prueba_telegram }}" = "true" ]; then LISTA="imagenes/ultima.png"; fi
          [ -z "$LISTA" ] && { echo "Nada que enviar"; exit 0; }
          N=$(echo "$LISTA" | wc -l)
          for IMG in $LISTA; do
            F=$(basename "$IMG" .png)
            CAP="Precio del pollo en Lima · boletín del $F · fuente MIDAGRI"
            [ "$N" -gt 1 ] && CAP="$CAP ($N boletines nuevos)"
            RESP=$(curl -sS --form-string chat_id="$CHAT" -F photo=@"$IMG" --form-string caption="$CAP" \
              "https://api.telegram.org/bot$T/sendPhoto") || true
            if echo "$RESP" | grep -q '"ok":true'; then echo "::notice::Enviada a Telegram: $F"
            else echo "::error::Telegram rechazó $F: $(echo "$RESP" | grep -o '"description":"[^"]*"')"; exit 1; fi
          done
      - name: Comentario semanal (viernes)
        id: semanal
        run: python scripts/imagen_semanal.py --automatico
      - name: Enviar comentario semanal a Telegram
        if: steps.semanal.outputs.semanal != '' && env.TG_TOKEN != ''
        run: |
          CHAT=$(echo "$TG_CHAT" | tr -d '[:space:]'); T=$(echo "$TG_TOKEN" | tr -d '[:space:]')
          RESP=$(curl -sS --form-string chat_id="$CHAT" -F photo=@"${{ steps.semanal.outputs.semanal }}" \
            --form-string caption="Comentario semanal${{ steps.semanal.outputs.actualizado == '1' && ' · ACTUALIZADO (llegó un boletín atrasado)' || '' }} · preciopollo.pe (revisar antes de publicar)" \
            "https://api.telegram.org/bot$T/sendPhoto") || true
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::Telegram rechazó la imagen semanal: $(echo "$RESP" | grep -o '"description":"[^"]*"')"; exit 1; }
          TXT=$(python3 -c "import json,sys; c=json.load(open(sys.argv[1])); print('Valores de control:\n'+'\n'.join(f'{k}: {v}' for k,v in c.items()))" "${{ steps.semanal.outputs.semanal_json }}")
          curl -sS --form-string chat_id="$CHAT" --form-string text="$TXT" "https://api.telegram.org/bot$T/sendMessage" > /dev/null
          echo "::notice::Comentario semanal enviado"
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data imagenes
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -m "Datos: $(date -u +%Y-%m-%d) $(grep -o 'Resumen:.*' data/ultima_corrida.log || true)"
          git pull --rebase origin main
          git push
