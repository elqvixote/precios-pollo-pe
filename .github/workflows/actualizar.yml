name: Actualizar datos

on:
  schedule:
    # Lima (UTC-5): ~09:52, 13:52 y 18:52. Idempotente: si no hay boletín nuevo no hace nada.
    - cron: "52 14 * * *"
    - cron: "52 18 * * *"
    - cron: "52 23 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Procesar desde (AAAA-MM-DD). Vacío = solo los últimos 2 meses"
        required: false
        default: ""
      hasta:
        description: "Procesar hasta (AAAA-MM-DD). Opcional"
        required: false
        default: ""
      reintentar_cuarentena:
        description: "Reintentar PDFs en cuarentena"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawler
        run: |
          ARGS=""
          if [ -n "${{ inputs.desde }}" ]; then ARGS="--desde ${{ inputs.desde }}"; else ARGS="--ultimos-meses 2"; fi
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          if [ "${{ inputs.reintentar_cuarentena }}" = "true" ]; then ARGS="$ARGS --reintentar-cuarentena"; fi
          python scripts/crawler.py $ARGS 2>&1 | grep -v FontBBox | tee data/ultima_corrida.log
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -m "Datos: $(date -u +%Y-%m-%d) $(grep -o 'Resumen:.*' data/ultima_corrida.log || true)"
          git pull --rebase origin main
          git push
