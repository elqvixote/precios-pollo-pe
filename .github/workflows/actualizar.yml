name: Actualizar datos

on:
  schedule:
    # No hay hora garantizada de publicación: se revisa seguido en la franja probable.
    # Lima (UTC-5), lunes a sábado: cada 30 min de 08:00 a 14:00 y cada hora de 15:00 a 21:00.
    # Cada corrida sin boletín nuevo dura ~1 minuto y no hace commit.
    - cron: "7,37 13-19 * * 1-6"
    - cron: "7 20-23,0-2 * * 1-6"
  workflow_dispatch:
    inputs:
      desde:
        description: "Procesar desde (AAAA-MM-DD). Vacío = solo los últimos 2 meses"
        required: false
        default: ""
      hasta:
        description: "Procesar hasta (AAAA-MM-DD). Opcional"
        required: false
        default: ""
      prueba_telegram:
        description: "Reenviar la última imagen a Telegram (prueba)"
        type: boolean
        default: false
      reintentar_cuarentena:
        description: "Reintentar PDFs en cuarentena"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawler
        run: |
          ARGS=""
          if [ -n "${{ inputs.desde }}" ]; then ARGS="--desde ${{ inputs.desde }}"; else ARGS="--ultimos-meses 2"; fi
          if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
          if [ "${{ inputs.reintentar_cuarentena }}" = "true" ]; then ARGS="$ARGS --reintentar-cuarentena"; fi
          python scripts/crawler.py $ARGS 2>&1 | grep -v FontBBox | tee data/ultima_corrida.log
      - name: Imagen diaria
        id: imagen
        run: python scripts/imagen_diaria.py --solo-si-nueva
      - name: Enviar a Telegram (si están configurados los secretos)
        if: (steps.imagen.outputs.nueva != '' || inputs.prueba_telegram) && env.TG_TOKEN != ''
        run: |
          IMG="${{ steps.imagen.outputs.nueva }}"; [ -z "$IMG" ] && IMG="imagenes/ultima.png"
          curl -sS --fail-with-body -F chat_id="$TG_CHAT" -F photo=@"$IMG" \
            -F caption="Precio del pollo en Lima · fuente MIDAGRI" \
            "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" | head -c 200; echo
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data imagenes
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -m "Datos: $(date -u +%Y-%m-%d) $(grep -o 'Resumen:.*' data/ultima_corrida.log || true)"
          git pull --rebase origin main
          git push
