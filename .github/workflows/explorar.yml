name: Explorar listado gob.pe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar URLs de listado
        run: |
          mkdir -p diagnostico/listados
          URLS=(
            "https://www.gob.pe/institucion/midagri/informes-publicaciones"
            "https://www.gob.pe/institucion/midagri/informes-publicaciones?term=aves"
            "https://www.gob.pe/institucion/midagri/informes-publicaciones?term=boletin+de+comercializacion+y+precios+de+aves"
            "https://www.gob.pe/busquedas?contenido[]=publicaciones&institucion[]=midagri&term=precios+de+aves"
            "https://www.gob.pe/busquedas?institucion[]=midagri&term=boletin+de+comercializacion+y+precios+de+aves&sort_by=recent"
          )
          i=0
          for url in "${URLS[@]}"; do
            i=$((i+1))
            curl -sS -L --max-time 30 -o diagnostico/listados/l$i.html -w "l$i HTTP %{http_code} %{size_download}B $url\n" "$url" | tee -a diagnostico/listados/resumen.txt
            echo "  links aves:" >> diagnostico/listados/resumen.txt
            grep -oE 'informes-publicaciones/[0-9]+-[a-z0-9-]*aves[a-z0-9-]*' diagnostico/listados/l$i.html | sort -u | head -40 | sed 's/^/    /' >> diagnostico/listados/resumen.txt || true
            echo "  paginación:" >> diagnostico/listados/resumen.txt
            grep -oE 'href="[^"]*(page|sheet)=[0-9]+[^"]*"' diagnostico/listados/l$i.html | sort -u | head -5 | sed 's/^/    /' >> diagnostico/listados/resumen.txt || true
            echo "  apis/json:" >> diagnostico/listados/resumen.txt
            grep -oE '"(/[a-z_/]*api[^"]*|[^"]*\.json[^"]*)"' diagnostico/listados/l$i.html | sort -u | head -5 | sed 's/^/    /' >> diagnostico/listados/resumen.txt || true
          done
          # guardar solo un recorte de cada HTML (evitar archivos grandes)
          for f in diagnostico/listados/l*.html; do head -c 150000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico
          git commit -m "Exploración de listados gob.pe" || echo "sin cambios"
          git push
